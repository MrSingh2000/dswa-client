
name: Deploy Vite Frontend to Azure Static Web Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Vite app
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || vars.VITE_API_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL || vars.VITE_API_BASE_URL }}

      - name: Verify build output
        run: |
          test -f dist/index.html
          if [ -f dist/staticwebapp.config.json ]; then
            size=$(wc -c < dist/staticwebapp.config.json)
            echo "Config file size: $size bytes"
            if [ "$size" -gt 20480 ]; then
              echo "ERROR: staticwebapp.config.json exceeds 20 KB"
              exit 1
            fi
          fi

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_WAVE_0A600641E }}
          action: upload
          app_location: dist
          output_location: ""
          skip_app_build: true
